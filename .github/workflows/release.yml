name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (Release)
        run: |
          dotnet publish -c Release -o publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TaskbarFolders.exe
          prerelease: false
          generate_release_notes: true
          body: |
            ### Taskbar Folders ${{ github.ref_name }}

            First stable release.

            **Highlights:**
            - Scan this PC with automatic categories
            - Custom folder colours & icons
            - Multiple themes + animations
            - Easy pinning with auto detection
            - Almost zero idle RAM usage

            **Requirements:**
            - Windows 11
            - [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64)

            **How to use:**
            1. Put `TaskbarFolders.exe` in a permanent folder
            2. Run it and create folders (or use Scan PC)
            3. Pin the folder to the taskbar
            4. Click the pinned icon to open the menu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
